---
layout: default
---

<div class="blogpage-wrap">
  <div class="blogpage-hero">
    <h1>{{ page.title }}</h1>
    <p>
      All articles from {{ page.title }} category.
    </p>
  </div>

  {% assign posts = site.categories[page.category_name] %}

  <div class="blogpage-grid">
    {% for post in posts %}
      <article class="blogpage-card">
        <a href="{{ post.url | relative_url }}" class="blogpage-thumb">
          <img 
            src="{{ post.thumbnail | default:'/assets/default-tool.webp' | relative_url }}"
            alt="{{ post.title }}"
            loading="lazy">
        </a>

        <div class="blogpage-content">
          <h2>
            <a href="{{ post.url | relative_url }}">
              {{ post.title }}
            </a>
          </h2>

          {% if post.description %}
          <p>
            {{ post.description | strip_html | truncate: 120 }}
          </p>
          {% endif %}
        </div>
      </article>
    {% endfor %}
  </div>
</div>

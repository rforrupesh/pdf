---
layout: default
title: Blog
---

<h1>Blog</h1>

<ul class="post-list">
  {% raw %}{% for post in site.posts %}{% endraw %}
    <li>
      <a href="{% raw %}{{ site.baseurl }}{{ post.url }}{% endraw %}">
        {% raw %}{{ post.title }}{% endraw %}
      </a>
    </li>
  {% raw %}{% endfor %}{% endraw %}
</ul>

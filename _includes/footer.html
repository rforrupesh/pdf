<!-- ── FAB GROUP (Share + Back to Top) ── -->
<style>
.fab-group {
  position: fixed;
  bottom: 28px;
  right: 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  z-index: 500;
}
.fab-btn {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: #fff;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
  transition: all .18s;
  box-shadow: 0 2px 10px rgba(0,0,0,.1);
}
.fab-btn:hover { background: var(--blue-light); border-color: #93c5fd; color: var(--blue); }
.fab-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fab-btn.share-fab { background: var(--blue); border-color: var(--blue); color: #fff; }
.fab-btn.share-fab:hover { background: var(--blue-hover); }
.fab-btn.share-fab svg { stroke: #fff; }
#backTopBtn { display: none; }

/* Share Modal */
.share-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 600;
  align-items: flex-end;
  justify-content: center;
}
.share-overlay.active { display: flex; }
.share-modal {
  background: #fff;
  border-radius: 16px 16px 0 0;
  width: 100%; max-width: 480px;
  padding: 0 0 24px;
  animation: shareSlideUp .28s cubic-bezier(0.32,0.72,0,1);
}
@keyframes shareSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.share-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 12px auto 14px; }
.share-header { display: flex; align-items: center; justify-content: space-between; padding: 0 18px 14px; border-bottom: 1px solid var(--border); }
.share-header h3 { font-size: 15px; font-weight: 600; color: var(--text); }
.share-close { width: 28px; height: 28px; border-radius: 50%; background: #f0f0f0; border: none; cursor: pointer; font-size: 14px; color: #555; display: flex; align-items: center; justify-content: center; }
.share-close:hover { background: #e5e7eb; }
.share-url-row { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.share-url-input { flex: 1; background: #f4f5f7; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font-size: 12px; color: var(--text-muted); font-family: inherit; outline: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.share-copy-btn { flex-shrink: 0; background: var(--blue); color: #fff; border: none; border-radius: 7px; padding: 8px 14px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; transition: background .15s; }
.share-copy-btn:hover { background: var(--blue-hover); }
.share-copy-btn.copied { background: #16a34a; }
.share-social-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 14px 18px 0; }
.share-social-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: #fff; transition: all .15s; text-decoration: none; }
.share-social-btn:hover { border-color: #93c5fd; background: var(--blue-light); }
.share-social-btn span { font-size: 11px; font-weight: 500; color: var(--text-muted); }
.share-social-btn:hover span { color: var(--blue); }
.share-social-btn svg { width: 22px; height: 22px; }
@media (max-width: 700px) {
  .fab-group { bottom: 80px; right: 16px; }
}
</style>

<script>
/* ── SHARE MODAL ── */
function openShareModal() {
  document.getElementById('shareUrlInput').value = window.location.href;
  document.getElementById('shareOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeShareModal() {
  document.getElementById('shareOverlay').classList.remove('active');
  document.body.style.overflow = '';
}
function copyShareUrl() {
  navigator.clipboard.writeText(window.location.href).catch(() => {
    const inp = document.getElementById('shareUrlInput');
    inp.select(); document.execCommand('copy');
  });
  const btn = document.getElementById('shareCopyBtn');
  btn.textContent = 'Copied!';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy link'; btn.classList.remove('copied'); }, 2000);
}
function doSocialShare(platform, e) {
  e.preventDefault();
  const url = encodeURIComponent(window.location.href);
  const title = encodeURIComponent(document.title);
  const urls = {
    fb: `https://www.facebook.com/sharer/sharer.php?u=${url}`,
    x: `https://twitter.com/intent/tweet?url=${url}&text=${title}`,
    linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${url}`,
    whatsapp: `https://wa.me/?text=${title}%20${url}`,
    pinterest: `https://pinterest.com/pin/create/button/?url=${url}&description=${title}`
  };
  window.open(urls[platform], '_blank', 'width=600,height=500');
  closeShareModal();
}

/* ── BACK TO TOP ── */
window.addEventListener('scroll', () => {
  document.getElementById('backTopBtn').style.display = window.scrollY > 300 ? 'flex' : 'none';
});
</script>

<!-- ── Responsive FAB Share System + Back To Top ── -->
<style>
:root{
  --blue:#2563eb;
  --blue-hover:#1d4ed8;
  --blue-light:#eff6ff;
  --text:#111827;
  --text-muted:#6b7280;
  --border:#e5e7eb;
  --shadow:0 10px 30px rgba(0,0,0,.12);
}

/* =========================
   FAB GROUP
========================= */
.fab-group{
  position:fixed;
  right:18px;
  bottom:22px;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:999;
}

.fab-btn{
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.2s ease;
}

.fab-btn:hover{
  transform:translateY(-2px);
}

.fab-btn svg{
  width:22px;
  height:22px;
  stroke:var(--text-muted);
  stroke-width:2;
  fill:none;
}

.fab-share{
  background:var(--blue);
}

.fab-share svg{
  stroke:#fff;
}

.fab-share:hover{
  background:var(--blue-hover);
}

#backTopBtn{
  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:.25s ease;
}

#backTopBtn.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

/* =========================
   SHARE MODAL
========================= */
.share-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  justify-content:center;
  align-items:flex-end;
  z-index:1000;
  opacity:0;
  pointer-events:none;
  transition:.25s ease;
}

.share-overlay.active{
  opacity:1;
  pointer-events:auto;
}

.share-modal{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding-bottom:env(safe-area-inset-bottom,20px);
  transform:translateY(100%);
  transition:.3s cubic-bezier(.32,.72,0,1);
  box-shadow:var(--shadow);
  max-height:92vh;
  overflow-y:auto;
}

.share-overlay.active .share-modal{
  transform:translateY(0);
}

.s-handle{
  width:46px;
  height:5px;
  border-radius:999px;
  background:#d1d5db;
  margin:12px auto 16px;
}

.s-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px 16px;
  border-bottom:1px solid var(--border);
}

.s-head h3{
  margin:0;
  font-size:17px;
  color:var(--text);
}

.s-close{
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:#f3f4f6;
  cursor:pointer;
  font-size:15px;
}

.s-close:hover{
  background:#e5e7eb;
}

/* URL BOX */
.s-url{
  display:flex;
  gap:10px;
  padding:18px;
  border-bottom:1px solid var(--border);
}

.s-url input{
  flex:1;
  min-width:0;
  height:44px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:0 14px;
  background:#f9fafb;
  color:var(--text-muted);
  font-size:13px;
  outline:none;
}

.s-copy{
  border:none;
  background:var(--blue);
  color:#fff;
  padding:0 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  transition:.2s;
  white-space:nowrap;
}

.s-copy:hover{
  background:var(--blue-hover);
}

.s-copy.ok{
  background:#16a34a;
}

/* =========================
   SHARE GRID
========================= */
.s-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
  gap:12px;
  padding:20px;
}

.s-btn{
  text-decoration:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:14px 10px;
  border:1px solid var(--border);
  border-radius:14px;
  transition:.2s ease;
  background:#fff;
}

.s-btn:hover{
  background:var(--blue-light);
  border-color:#93c5fd;
  transform:translateY(-2px);
}

.s-btn span{
  font-size:12px;
  color:var(--text-muted);
  font-weight:500;
  text-align:center;
}

.s-btn svg{
  width:28px;
  height:28px;
}

/* =========================
   MOBILE
========================= */
@media (max-width:768px){

  .fab-group{
    right:14px;
    bottom:75px;
  }

  .fab-btn{
    width:48px;
    height:48px;
  }

  .share-modal{
    max-width:100%;
    border-radius:20px 20px 0 0;
  }

  .s-grid{
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }

  .s-btn{
    padding:16px 8px;
  }

  .s-url{
    flex-direction:column;
  }

  .s-copy{
    width:100%;
    height:44px;
  }
}

@media (max-width:480px){

  .s-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .s-head h3{
    font-size:16px;
  }

  .s-btn span{
    font-size:11px;
  }
}
</style>

<!-- =========================
     FLOATING BUTTONS
========================= -->
<div class="fab-group">

  <!-- Back To Top -->
  <button class="fab-btn" id="backTopBtn" aria-label="Back to top">
    <svg viewBox="0 0 24 24">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Share -->
  <button class="fab-btn fab-share" id="shareBtn" aria-label="Share page">
    <svg viewBox="0 0 24 24">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
      <line x1="15.4" y1="6.5" x2="8.6" y2="10.5"></line>
    </svg>
  </button>

</div>

<!-- =========================
     SHARE MODAL
========================= -->
<div class="share-overlay" id="shareOverlay">

  <div class="share-modal">

      <h3>Share this page</h3>

      <button class="s-close" id="closeShare">

      </button>

    <div class="s-url">
      <input type="text" id="shareUrl" readonly>

        Copy Link
      </button>
    </div>

    <!-- SHARE BUTTONS -->
    <div class="s-grid">

      <!-- Facebook -->
      <a href="#" class="s-btn" data-share="facebook">
        <svg viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="6" fill="#1877F2"/>

        </svg>
        <span>Facebook</span>

      <!-- X -->
      <a href="#" class="s-btn" data-share="twitter">

          <path d="M17.5 4H20l-5.5 6.3L21 20h-5l-3.6-4.7L8 20H5.5l5.9-6.7L4 4h5.2l3.2 4.2L17.5 4z" fill="#fff"/>
        </svg>
        <span>X</span>
      </a>

      <!-- LinkedIn -->
      <a href="#" class="s-btn" data-share="linkedin">
        <svg viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="6" fill="#0A66C2"/>
          <path d="M7 9h2v9H7V9zm1-1.5a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5zM11 9h2v1.3c.4-.7 1.3-1.5 2.7-1.5C17.7 8.8 18 10.5 18 12v6h-2v-5.5c0-1.3-.5-2-1.5-2s-1.5.7-1.5 2V18h-2V9z" fill="#fff"/>
        </svg>
        <span>LinkedIn</span>
      </a>

      <!-- WhatsApp -->
      <a href="#" class="s-btn" data-share="whatsapp">

      <a href="#" class="s-btn" data-share="pinterest">

          <rect width="24" height="24" rx="6" fill="#E60023"/>

        <span>Pinterest</span>
      </a>

    </div>

  </div>
</div>

<script>
const shareOverlay = document.getElementById("shareOverlay");
const shareBtn = document.getElementById("shareBtn");
const closeShare = document.getElementById("closeShare");
const shareUrl = document.getElementById("shareUrl");
const copyBtn = document.getElementById("copyBtn");
const backTopBtn = document.getElementById("backTopBtn");

/* =========================
   OPEN SHARE
========================= */
shareBtn.addEventListener("click", async () => {

  const url = window.location.href;
  const title = document.title;

  // Native mobile share
  if (navigator.share && window.innerWidth <= 768) {
    try{
      await navigator.share({
        title,
        url
      });
      return;
    }catch(err){}
  }

  shareUrl.value = url;
  shareOverlay.classList.add("active");
  document.body.style.overflow = "hidden";
});

/* =========================
   CLOSE SHARE
========================= */
function closeModal(){
  shareOverlay.classList.remove("active");
  document.body.style.overflow = "";
}

closeShare.addEventListener("click", closeModal);

shareOverlay.addEventListener("click", (e)=>{
  if(e.target === shareOverlay){
    closeModal();
  }
});

/* ESC CLOSE */
document.addEventListener("keydown",(e)=>{
  if(e.key === "Escape"){
    closeModal();
  }
});

/* =========================
   COPY LINK
========================= */
copyBtn.addEventListener("click", async ()=>{

  try{
    await navigator.clipboard.writeText(window.location.href);
  }catch(err){
    shareUrl.select();
    document.execCommand("copy");
  }

  copyBtn.innerText = "Copied!";
  copyBtn.classList.add("ok");

  setTimeout(()=>{
    copyBtn.innerText = "Copy Link";
    copyBtn.classList.remove("ok");
  },2000);
});

/* =========================
   SHARE LINKS
========================= */
document.querySelectorAll(".s-btn").forEach(btn=>{

  btn.addEventListener("click",(e)=>{

    e.preventDefault();

    const type = btn.dataset.share;

    const url = encodeURIComponent(window.location.href);
    const title = encodeURIComponent(document.title);

    const links = {
      facebook:`https://www.facebook.com/sharer/sharer.php?u=${url}`,
      twitter:`https://twitter.com/intent/tweet?url=${url}&text=${title}`,
      linkedin:`https://www.linkedin.com/sharing/share-offsite/?url=${url}`,
      whatsapp:`https://wa.me/?text=${title}%20${url}`,
      pinterest:`https://pinterest.com/pin/create/button/?url=${url}&description=${title}`
    };

    window.open(
      links[type],
      "_blank",
      "width=600,height=500"
    );

    closeModal();
  });

});

/* =========================
   BACK TO TOP
========================= */
window.addEventListener("scroll",()=>{

  if(window.scrollY > 300){
    backTopBtn.classList.add("show");
  }else{
    backTopBtn.classList.remove("show");
  }

});

backTopBtn.addEventListener("click",()=>{
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
});
</script>

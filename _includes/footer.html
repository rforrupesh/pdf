/* ── Variables ── */
:root {

  --muted: #6b7280;
  --radius-md: 8px;

}

/* ── FAB group ── */
.fab-grp {
  position: fixed;
  bottom: 28px;

  display: flex;

  align-items: center;
  gap: 9px;

}
.fab {

  border: 1.5px solid var(--border);

  display: flex; align-items: center; justify-content: center;
  transition: background .18s, border-color .18s;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  flex-shrink: 0;
}
.fab svg {
  width: 18px; height: 18px;
  stroke: var(--muted); fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  transition: stroke .18s;
}
.fab:hover { background: var(--blue-light); border-color: #93c5fd; }
.fab:hover svg { stroke: var(--blue); }

/* Share FAB */
.fab-share { background: var(--blue); border-color: var(--blue); }
.fab-share svg { stroke: #fff; }
.fab-share:hover { background: var(--blue-hover); border-color: var(--blue-hover); }

/* Back to top */
.fab-top { display: none; }

/* ── Overlay ── */
.s-overlay {

  align-items: flex-end;

/* ── Share modal (bottom-sheet on mobile) ── */
.s-modal {

@keyframes sheetUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
@keyframes fadeIn  { from { opacity: 0; transform: scale(.95) } to { opacity: 1; transform: scale(1) } }

.s-handle {

}
.s-x:hover { background: #e5e7eb; }

.s-url {

}
.s-url input {
  flex: 1; min-width: 0;

  border-radius: 8px; padding: 8px 10px;
  font-size: 12px; color: var(--muted);
  font-family: inherit; outline: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.s-copy {
  flex-shrink: 0;
  background: var(--blue); color: #fff;
  border: none; border-radius: 8px;
  padding: 8px 15px;
  font-size: 13px; font-weight: 500;
  cursor: pointer; font-family: inherit;
  transition: background .14s;
}
.s-copy:hover { background: var(--blue-hover); }
.s-copy.ok { background: #16a34a; }

/* ── Social grid ── */
.s-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  padding: 14px 18px 20px;
}
.s-item {
  display: flex; flex-direction: column;

  border-radius: 10px;

  transition: border-color .14s, background .14s;
  text-decoration: none;
}
.s-item:hover { border-color: #93c5fd; background: var(--blue-light); }
.s-item svg { width: 22px; height: 22px; flex-shrink: 0; }
.s-item span {
  font-size: 10px; font-weight: 500;
  color: var(--muted); text-align: center; line-height: 1.2;
}
.s-item:hover span { color: var(--blue); }

/* ── Desktop: centered dialog ≥ 520px ── */
@media (min-width: 520px) {
  .s-overlay { align-items: center; }
  .s-modal {
    border-radius: 16px;
    max-width: 460px;
    animation: fadeIn .2s cubic-bezier(.32,.72,0,1) forwards;
  }
  .s-handle { display: none; }
}

/* ── Mobile ≤ 480px ── */
@media (max-width: 480px) {
  .fab-grp { bottom: 80px; right: 14px; }
  .fab { width: 42px; height: 42px; }
  .fab svg { width: 16px; height: 16px; }
  .s-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 12px 14px 18px; }
  .s-item { padding: 10px 3px; }
  .s-item span { font-size: 9px; }
}

/* ── Very small ≤ 360px: 4 columns, hide labels ── */
@media (max-width: 360px) {
  .s-grid { grid-template-columns: repeat(4, 1fr); }
  .s-item span { display: none; }
  .s-item { padding: 12px 4px; }
}
</style>

<script>
(function(){
  const map = {
    fb:     u      => `https://www.facebook.com/sharer/sharer.php?u=${u}`,
    x:      (u,t)  => `https://twitter.com/intent/tweet?url=${u}&text=${t}`,
    wa:     (u,t)  => `https://wa.me/?text=${t}%20${u}`,
    tg:     (u,t)  => `https://t.me/share/url?url=${u}&text=${t}`,
    li:     u      => `https://www.linkedin.com/sharing/share-offsite/?url=${u}`,
    rd:     (u,t)  => `https://reddit.com/submit?url=${u}&title=${t}`,
    pin:    (u,t)  => `https://pinterest.com/pin/create/button/?url=${u}&description=${t}`,
    signal: u      => `https://signal.me`,
    email:  (u,t)  => `mailto:?subject=${t}&body=${u}`,
    sms:    (u,t)  => `sms:?body=${t}%20${u}`
  };

  window.go = function(p, e) {
    if (e) e.preventDefault();
    const u = encodeURIComponent(window.location.href);
    const t = encodeURIComponent(document.title || 'Check this out');
    if (p === 'native') {
      if (navigator.share) {
        navigator.share({ title: document.title, url: window.location.href }).catch(() => {});
      } else {
        openModal();
        return;
      }
    } else if (p === 'email' || p === 'sms') {
      window.location.href = map[p](u, t);
    } else {
      window.open(map[p](u, t), '_blank', 'width=640,height=520');
    }
    closeModal();
  };

  window.openModal = function() {
    document.getElementById('urlInp').value = window.location.href;
    document.getElementById('sOverlay').classList.add('on');
    document.body.style.overflow = 'hidden';
  };

  window.closeModal = function() {
    document.getElementById('sOverlay').classList.remove('on');
    document.body.style.overflow = '';
  };

  window.doCopy = function() {
    navigator.clipboard.writeText(window.location.href).catch(() => {
      const i = document.getElementById('urlInp');
      i.select();
      document.execCommand('copy');
    });
    const b = document.getElementById('copyBtn');
    b.textContent = 'Copied!';
    b.classList.add('ok');
    setTimeout(() => { b.textContent = 'Copy link'; b.classList.remove('ok'); }, 2200);
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  window.addEventListener('scroll', () => {
    const t = document.getElementById('fabTop');
    if (t) t.style.display = window.scrollY > 300 ? 'flex' : 'none';
  });
})();
</script>

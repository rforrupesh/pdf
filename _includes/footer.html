<!-- ── FAB: Share + Back to Top ── -->
<style>
.fab-group{
  position:fixed;bottom:28px;right:20px;
  display:flex;flex-direction:column;align-items:center;
  gap:10px;z-index:500;
}
.fab-btn{
  width:46px;height:46px;border-radius:50%;
  border:1.5px solid var(--border);background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .18s;box-shadow:0 2px 10px rgba(0,0,0,.1);
}
.fab-btn svg{
  width:18px;height:18px;stroke:var(--text-muted);
  fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}
.fab-btn:hover{background:var(--blue-light);border-color:#93c5fd;}
.fab-btn:hover svg{stroke:var(--blue);}
.fab-btn.fab-share{background:var(--blue);border-color:var(--blue);}
.fab-btn.fab-share svg{stroke:#fff;}
.fab-btn.fab-share:hover{background:var(--blue-hover);}
#backTopBtn{display:none;}

/* ── Overlay ── */
.share-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.35);z-index:600;
  align-items:flex-end;justify-content:center;
}
.share-overlay.active{display:flex;}

/* ── Modal (bottom-sheet on mobile) ── */
.share-modal{
  background:#fff;
  border-radius:16px 16px 0 0;
  width:100%;max-width:100%;
  padding:0 0 env(safe-area-inset-bottom,16px);
  animation:sUp .26s cubic-bezier(.32,.72,0,1);
}
@keyframes sUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sFade{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

.s-handle{
  width:36px;height:4px;background:#ddd;
  border-radius:2px;margin:12px auto 14px;
}
.s-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px 14px;border-bottom:1px solid var(--border);
}
.s-head h3{font-size:15px;font-weight:600;color:var(--text);margin:0;}
.s-close{
  width:28px;height:28px;border-radius:50%;
  background:#f0f0f0;border:none;cursor:pointer;
  font-size:14px;color:#555;
  display:flex;align-items:center;justify-content:center;
}
.s-close:hover{background:#e5e7eb;}

.s-url{
  display:flex;align-items:center;gap:8px;
  padding:14px 18px;border-bottom:1px solid var(--border);
}
.s-url input{
  flex:1;min-width:0;background:#f4f5f7;
  border:1px solid var(--border);border-radius:7px;
  padding:8px 10px;font-size:12px;color:var(--text-muted);
  font-family:inherit;outline:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.s-copy{
  flex-shrink:0;background:var(--blue);color:#fff;
  border:none;border-radius:7px;padding:8px 16px;
  font-size:13px;font-weight:500;cursor:pointer;
  font-family:inherit;transition:background .15s;
}
.s-copy:hover{background:var(--blue-hover);}
.s-copy.ok{background:#16a34a;}

.s-grid{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:8px;padding:14px 18px 18px;
}
.s-btn{
  display:flex;flex-direction:column;align-items:center;
  gap:6px;padding:12px 4px;
  border:1px solid var(--border);border-radius:10px;
  cursor:pointer;background:#fff;
  transition:all .15s;text-decoration:none;
}
.s-btn:hover{border-color:#93c5fd;background:var(--blue-light);}
.s-btn span{font-size:11px;font-weight:500;color:var(--text-muted);}
.s-btn:hover span{color:var(--blue);}
.s-btn svg{width:22px;height:22px;flex-shrink:0;}

/* ── Desktop: centered dialog ── */
@media(min-width:540px){
  .share-overlay{align-items:center;}
  .share-modal{
    border-radius:16px;
    max-width:440px;
    animation:sFade .22s cubic-bezier(.32,.72,0,1);
  }
  .s-handle{display:none;}
}

/* ── Mobile: above bottom nav bar ── */
@media(max-width:700px){
  .fab-group{bottom:80px;right:14px;}
  .fab-btn{width:42px;height:42px;}
  .s-grid{gap:6px;padding:12px 14px 16px;}
  .s-btn{padding:10px 2px;}
  .s-btn span{font-size:10px;}
}

/* ── Very small screens: hide labels ── */
@media(max-width:380px){
  .s-grid{gap:5px;padding:10px 12px 14px;}
  .s-btn span{display:none;}
  .s-btn{padding:11px 4px;}
}
</style>

<!-- Share Modal -->
<div class="share-overlay" id="shareOverlay"
  onclick="if(event.target===this)closeShareModal()">

    <div class="s-head">

        <span>WhatsApp</span>
      </a>
      <a class="s-btn" href="#" onclick="sShare('pin',event)" aria-label="Share on Pinterest">
        <svg viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="5" fill="#E60023"/><path d="M12 3C7 3 3 7 3 12c0 3.9 2.4 7.3 5.9 8.7-.1-.7-.1-1.8.1-2.6.2-.7 1.4-5.8 1.4-5.8s-.4-.7-.4-1.8c0-1.7 1-2.9 2.2-2.9 1 0 1.5.8 1.5 1.7 0 1-.7 2.6-1 4 0 1.7 1.2 3 2.9 3 3.5 0 5.9-4.5 5.9-9.7 0-4-2.7-6.8-6.6-6.8-4.5 0-7.2 3.4-7.2 6.9 0 1.4.5 2.8 1.3 3.6.1.1.2.3.1.5l-.5 1.8c-.1.2-.3.3-.5.2C6.1 15.6 5 14 5 12.2c0-4.9 3.6-9.5 10.2-9.5 5.4 0 9.5 3.8 9.5 8.9 0 5.3-3.3 9.6-7.9 9.6-1.6 0-3-.8-3.5-1.8l-.9 3.5c-.3 1.2-1.2 2.7-1.8 3.6.7.2 1.3.3 2 .3 4.9 0 9-4 9-9S17 3 12 3z" fill="#fff"/></svg>

</div>

<script>
function openShareModal(){
  document.getElementById('sUrlInp').value=window.location.href;
  document.getElementById('shareOverlay').classList.add('active');
  document.body.style.overflow='hidden';
}
function closeShareModal(){
  document.getElementById('shareOverlay').classList.remove('active');
  document.body.style.overflow='';
}
function doShareCopy(){
  navigator.clipboard.writeText(window.location.href).catch(()=>{
    const i=document.getElementById('sUrlInp');i.select();document.execCommand('copy');
  });
  const b=document.getElementById('sCopyBtn');
  b.textContent='Copied!';b.classList.add('ok');
  setTimeout(()=>{b.textContent='Copy link';b.classList.remove('ok');},2000);
}
function sShare(p,e){
  e.preventDefault();
  const u=encodeURIComponent(window.location.href);
  const t=encodeURIComponent(document.title);
  const map={
    fb:`https://www.facebook.com/sharer/sharer.php?u=${u}`,
    x:`https://twitter.com/intent/tweet?url=${u}&text=${t}`,
    li:`https://www.linkedin.com/sharing/share-offsite/?url=${u}`,
    wa:`https://wa.me/?text=${t}%20${u}`,
    pin:`https://pinterest.com/pin/create/button/?url=${u}&description=${t}`
  };
  window.open(map[p],'_blank','width=620,height=500');
  closeShareModal();
}
window.addEventListener('scroll',()=>{
  document.getElementById('backTopBtn').style.display=window.scrollY>300?'flex':'none';
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeShareModal();});
</script>

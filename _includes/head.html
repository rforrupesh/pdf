<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <!-- SEO -->
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.title }}">

  <!-- ✅ Canonical URL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" href="data:,">
  <meta property="og:image" content="{{ site.baseurl }}/assets/images/preview.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.baseurl }}/assets/images/preview.png">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  {% if page.css %}
<link rel="stylesheet" href="{{ '/assets/css/' | append: page.css | append: '.css' | relative_url }}">
{% endif %}

{% if page.styles %}
  {% for style in page.styles %}
    <link rel="stylesheet" href="{{ style }}">
  {% endfor %}
{% endif %}

{% if page.head_style %}
  <style>
    {{ page.head_style }}
  </style>
{% endif %}


{% if page.scripts %}
  {% for script in page.scripts %}
    {% if script contains 'http' %}
      <script src="{{ script }}"></script>
    {% else %}
      <script src="{{ script | relative_url }}"></script>
    {% endif %}
  {% endfor %}
{% endif %}
  
</head>

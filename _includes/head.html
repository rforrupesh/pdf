<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="{% if page.robots %}{{ page.robots }}{% else %}index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1{% endif %}">
  <title>
    {% if page.title %}
      {{ page.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <!-- SEO -->
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.title }}">
  {% if page.keywords %}
<meta name="keywords" content="{{ page.keywords }}">
{% endif %}

  <!-- ✅ Canonical URL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
      <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/assets/img/favicon-32x32.png">
  <meta property="og:image" content="{{ site.baseurl }}/assets/img/unir.png">
<meta name="author" content="{{ page.author | default: site.author }}">

<meta property="og:site_name" content="{{ page.og_site_name | default: site.og_site_name }}"/>
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.baseurl }}/assets/img/unir.png">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css?v=1">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  {% if page.css %}
<link rel="stylesheet" href="{{ '/assets/css/' | append: page.css | append: '.css' | relative_url }}">
{% endif %}



{% if page.head_style %}
<style>
{{ page.head_style }}
</style>
{% endif %}

{% if page.scripts %}
  {% for script in page.scripts %}
    {% if script contains 'http' %}
      <script src="{{ script }}"></script>
    {% else %}
      <script src="{{ script | relative_url }}"></script>
    {% endif %}
  {% endfor %}
{% endif %}
  
</head>
